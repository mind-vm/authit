version: "2"
sql:
  - engine: "postgresql"
    queries: "pgstore/internal/db/queries/"
    schema: "pgstore/migrations/"
    gen:
      go:
        package: "db"
        out: "pgstore/internal/db"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          # store's ports speak string ids; pgx encodes and scans uuid as text.
          - db_type: "uuid"
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
