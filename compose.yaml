# The Postgres authit's tests run against.
#
# Provisioning is deliberately the caller's job rather than testcontainers':
# that package brings docker/docker and the modules behind it into the test
# dependency set, and its reaper reaps by label — which can remove long-lived
# containers belonging to something else on the same machine. A DSN has neither
# problem.
#
#   docker compose up -d
#   export AUTHIT_TEST_POSTGRES=postgres://postgres:authit@127.0.0.1:5459/postgres
#   go test ./...
#
# The port is deliberately unusual: 5432 and 5433 are routinely occupied by
# whatever else is running locally, and a test suite that fails because it
# reached someone else's database is worse than one that fails to connect.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: authit
    ports:
      - "5459:5432"
    # Nothing here is worth keeping: every test creates and drops a database
    # of its own, so a restart starting empty is correct.
    tmpfs:
      - /var/lib/postgresql/data
